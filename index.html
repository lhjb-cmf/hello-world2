<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IKB</title>
  <style>
    :root { --ikb: #1f27a9; } /* International Klein Blue, warmed towards ultramarine like the real pigment */
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ikb); }

    /* The live camera in its real colours, under the IKB canvas */
    #camera {
      position: fixed;
      inset: 0;
      background: var(--ikb); /* with no camera, wiping just finds more blue: a pure IKB monochrome */
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror, like looking at yourself */
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    video.live { opacity: 1; }

    /* The IKB canvas the cursor wipes away */
    #pigment {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="camera">
    <video autoplay muted playsinline></video>
  </div>
  <canvas id="pigment"></canvas>
  <script>
    const video = document.querySelector('video');
    navigator.mediaDevices?.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
      .then(stream => {
        video.srcObject = stream;
        video.addEventListener('playing', () => video.classList.add('live'), { once: true });
      })
      .catch(err => console.warn('Camera unavailable, showing the monochrome:', err.name));

    // A canvas of IKB over the camera. The cursor wipes the pigment away with a soft brush,
    // and the blue slowly settles back
    const RADIUS = 90;
    const IKB = getComputedStyle(document.documentElement).getPropertyValue('--ikb').trim();
    const pigment = document.getElementById('pigment');
    const ctx = pigment.getContext('2d');

    // IKB with a powdery pigment grain built in, so the grain belongs to the blue and never touches the camera
    const PAINT = (() => {
      const tile = document.createElement('canvas');
      tile.width = tile.height = 220;
      const t = tile.getContext('2d');
      t.fillStyle = IKB;
      t.fillRect(0, 0, 220, 220);
      const img = t.getImageData(0, 0, 220, 220);
      for (let i = 0; i < img.data.length; i += 4) {
        const shade = 1 - Math.random() ** 3 * 0.35; // mostly flat colour, with scattered darker specks
        img.data[i] *= shade; img.data[i + 1] *= shade; img.data[i + 2] *= shade;
      }
      t.putImageData(img, 0, 0);
      return ctx.createPattern(tile, 'repeat');
    })();

    function resize() {
      pigment.width = innerWidth;
      pigment.height = innerHeight;
      ctx.fillStyle = PAINT;
      ctx.fillRect(0, 0, pigment.width, pigment.height);
    }

    // Grainy brush tips: solid in the middle, breaking up into random speckle towards the rim like dry pigment.
    // A few variants, picked at random per dab, so the grain never repeats along a stroke
    const TIPS = Array.from({ length: 8 }, () => {
      const size = RADIUS * 2, tip = document.createElement('canvas');
      tip.width = tip.height = size;
      const t = tip.getContext('2d'), img = t.createImageData(size, size);
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const d = Math.hypot(x - RADIUS + 0.5, y - RADIUS + 0.5) / RADIUS;
        const keep = Math.min(1, Math.max(0, (1 - d) / 0.75)) ** 1.6; // chance a speck is wiped: 1 at the centre, 0 at the rim
        if (Math.random() < keep) img.data[(y * size + x) * 4 + 3] = 150;
      }
      t.putImageData(img, 0, 0);
      return tip;
    });

    function wipe(x, y) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.drawImage(TIPS[Math.floor(Math.random() * TIPS.length)], x - RADIUS, y - RADIUS);
      ctx.globalCompositeOperation = 'source-over';
    }

    let last = null, lastMove = 0;
    addEventListener('pointermove', e => {
      const x = e.clientX, y = e.clientY;
      if (last) { // fill in between events so fast strokes stay continuous
        const n = Math.max(1, Math.ceil(Math.hypot(x - last.x, y - last.y) / (RADIUS * 0.15)));
        for (let i = 1; i <= n; i++) wipe(last.x + (x - last.x) * i / n, last.y + (y - last.y) * i / n);
      } else wipe(x, y);
      last = { x, y };
      lastMove = performance.now();
    });
    document.addEventListener('pointerleave', () => last = null);

    // Settle back in bigger, less frequent steps so 8-bit alpha rounding can't leave a faint ghost,
    // then cover fully once the cursor has been still for a while
    let tick = 0;
    function frame(now) {
      if (++tick % 5 === 0) {
        ctx.globalAlpha = 0.06;
        ctx.fillStyle = PAINT;
        ctx.fillRect(0, 0, pigment.width, pigment.height);
        ctx.globalAlpha = 1;
      }
      if (now - lastMove > 8000) {
        ctx.fillStyle = PAINT;
        ctx.fillRect(0, 0, pigment.width, pigment.height);
      }
      requestAnimationFrame(frame);
    }

    addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
