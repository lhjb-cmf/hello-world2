<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IKB</title>
  <style>
    :root { --ikb: #1f27a9; } /* International Klein Blue, warmed towards ultramarine like the real pigment */
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ikb); }

    /* Layers, bottom to top: grainy IKB ground, camera painted on with the brush, snapshots on top */
    canvas, #flash {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    body { touch-action: none; }
    video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; } /* frames are drawn from it, not shown */
    #flash {
      background: #fff;
      opacity: 0;
      transition: opacity .35s ease-out;
    }
    #flash.on { opacity: .35; transition: none; }
  </style>
</head>
<body>
  <video autoplay muted playsinline></video>
  <canvas id="ground"></canvas>
  <canvas id="layers"></canvas>
  <canvas id="snapshots"></canvas>
  <div id="flash"></div>
  <script>
    // Paint with the camera on a canvas of IKB: the brush stamps what the camera sees at that moment and it stays,
    // so strokes layer up over time. A click takes a small snapshot of your face (or now and then a fruit label), which glides onto your face
    // in the live camera, taking its own spot in a ring around it, and follows as you move. Esc clears.
    const RADIUS = 90;          // brush
    const SNAP_RADIUS = 60;     // click snapshot
    const SHRINK = 0.2;         // snapped faces are minis, at this fraction of your face's size
    const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5)); // ~137.5°, so each new sticker lands in the biggest gap
    const IKB = getComputedStyle(document.documentElement).getPropertyValue('--ikb').trim();

    const video = document.querySelector('video');
    let live = false;
    navigator.mediaDevices?.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
      .then(stream => {
        video.srcObject = stream;
        video.addEventListener('playing', () => live = true, { once: true });
      })
      .catch(err => console.warn('Camera unavailable, showing the monochrome:', err.name));

    // Face finding runs on-device with MediaPipe; loaded dynamically so the page still works if it can't load
    let faceDetector = null;
    (async () => {
      try {
        const { FaceDetector, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs');
        const wasm = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm');
        faceDetector = await FaceDetector.createFromOptions(wasm, {
          baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' },
          runningMode: 'VIDEO',
        });
      } catch (err) {
        console.warn('Face finding unavailable, snapshots will show what is under the cursor and stay put:', err);
      }
    })();

    const ground = document.getElementById('ground'), gctx = ground.getContext('2d');
    const layers = document.getElementById('layers'), lctx = layers.getContext('2d');
    const snapshots = document.getElementById('snapshots'), sctx = snapshots.getContext('2d');
    const flash = document.getElementById('flash');
    const frame = document.createElement('canvas'), fctx = frame.getContext('2d');   // the current camera frame
    const stroke = document.createElement('canvas'), kctx = stroke.getContext('2d'); // brush marks waiting to be painted
    let dpr = 1;

    // IKB with a powdery pigment grain built in
    const PAINT = (() => {
      const tile = document.createElement('canvas');
      tile.width = tile.height = 220;
      const t = tile.getContext('2d');
      t.fillStyle = IKB;
      t.fillRect(0, 0, 220, 220);
      const img = t.getImageData(0, 0, 220, 220);
      for (let i = 0; i < img.data.length; i += 4) {
        const shade = 1 - Math.random() ** 3 * 0.35; // mostly flat colour, with scattered darker specks
        img.data[i] *= shade; img.data[i + 1] *= shade; img.data[i + 2] *= shade;
      }
      t.putImageData(img, 0, 0);
      return tile;
    })();

    // Grainy tips: solid in the middle, breaking up into random speckle towards the rim like dry pigment.
    // A few variants, picked at random, so the grain never repeats
    function makeTips(radius, count, edge = 0.75) { // edge: how far in from the rim the grain reaches
      return Array.from({ length: count }, () => {
        const size = radius * 2, tip = document.createElement('canvas');
        tip.width = tip.height = size;
        const t = tip.getContext('2d'), img = t.createImageData(size, size);
        for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
          const d = Math.hypot(x - radius + 0.5, y - radius + 0.5) / radius;
          const keep = Math.min(1, Math.max(0, (1 - d) / edge)) ** 1.6; // 1 at the centre, 0 at the rim
          if (Math.random() < keep) img.data[(y * size + x) * 4 + 3] = 255;
        }
        t.putImageData(img, 0, 0);
        return tip;
      });
    }
    const TIPS = makeTips(RADIUS, 8);
    const SNAP_TIPS = makeTips(SNAP_RADIUS, 6, 0.35); // a narrower grain band, so small faces stay clear
    const pick = tips => tips[Math.floor(Math.random() * tips.length)];

    // Copy the camera's current frame, cropped to cover the window and mirrored like a selfie view
    function grabFrame() {
      const w = frame.width, h = frame.height;
      const scale = Math.max(w / video.videoWidth, h / video.videoHeight);
      const vw = video.videoWidth * scale, vh = video.videoHeight * scale;
      fctx.setTransform(-1, 0, 0, 1, w, 0);
      fctx.drawImage(video, (w - vw) / 2, (h - vh) / 2, vw, vh);
      fctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // Stamp the current frame through a mask of grainy tips onto a layer
    function stampFrame(mask, target) {
      grabFrame();
      fctx.globalCompositeOperation = 'destination-in';
      fctx.drawImage(mask, 0, 0);
      fctx.globalCompositeOperation = 'source-over';
      target.drawImage(frame, 0, 0);
    }

    // Brush: collect grainy dabs along the cursor's path, then paint them with the camera once per frame
    let last = null, pending = false;
    function dab(x, y) {
      kctx.drawImage(pick(TIPS), (x - RADIUS) * dpr, (y - RADIUS) * dpr, RADIUS * 2 * dpr, RADIUS * 2 * dpr);
      pending = true;
    }
    addEventListener('pointermove', e => {
      if (!live) return;
      const x = e.clientX, y = e.clientY;
      if (last) { // fill in between events so fast strokes stay continuous
        const n = Math.max(1, Math.ceil(Math.hypot(x - last.x, y - last.y) / (RADIUS * 0.3)));
        for (let i = 1; i <= n; i++) dab(last.x + (x - last.x) * i / n, last.y + (y - last.y) * i / n);
      } else dab(x, y);
      last = { x, y };
    });
    document.addEventListener('pointerleave', () => last = null);

    // Face tracking: where the biggest face is on screen right now (CSS pixels), its size, and its tilt
    let face = null, lastVideoTime = -1;
    function trackFace(now) {
      if (!faceDetector || !live || !video.videoWidth || video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;
      let d;
      try {
        d = faceDetector.detectForVideo(video, now).detections
          .sort((a, b) => b.boundingBox.width * b.boundingBox.height - a.boundingBox.width * a.boundingBox.height)[0];
      } catch (err) { // a bad frame shouldn't stop the page animating
        console.warn('Face tracking skipped a frame:', err);
        return;
      }
      if (!d) { face = null; return; }
      // video pixels → the mirrored, cover-cropped screen
      const W = innerWidth, H = innerHeight, vw = video.videoWidth, vh = video.videoHeight;
      const scale = Math.max(W / vw, H / vh), ox = (W - vw * scale) / 2, oy = (H - vh * scale) / 2;
      const toScreen = (x, y) => [W - (ox + x * scale), oy + y * scale];
      const b = d.boundingBox;
      const [x, y] = toScreen(b.originX + b.width / 2, b.originY + b.height / 2);
      const [rex, rey] = toScreen(d.keypoints[0].x * vw, d.keypoints[0].y * vh); // eyes, for the head's tilt
      const [lex, ley] = toScreen(d.keypoints[1].x * vw, d.keypoints[1].y * vh);
      face = { x, y, size: Math.max(b.width, b.height) * scale * 1.6, angle: Math.atan2(rey - ley, rex - lex) };
    }

    // Snapshots glide towards the tracked face, each with its own lag, so they trail as echoes when you move
    const snaps = [];
    function drawSnaps() {
      sctx.setTransform(1, 0, 0, 1, 0, 0);
      sctx.clearRect(0, 0, snapshots.width, snapshots.height);
      for (const s of snaps) {
        if (face) {
          // each sticker's spot in the ring turns with the head and scales with the face
          const a = s.slot + face.angle, r = s.reach * face.size;
          s.x += (face.x + Math.cos(a) * r - s.x) * s.lag;
          s.y += (face.y + Math.sin(a) * r - s.y) * s.lag;
          s.size += (face.size * SHRINK - s.size) * s.lag;
          let turn = face.angle - s.angle;
          turn = Math.atan2(Math.sin(turn), Math.cos(turn));
          s.angle += turn * s.lag;
        }
        sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        sctx.translate(s.x, s.y);
        sctx.rotate(s.angle + s.tilt);
        sctx.drawImage(s.img, -s.size / 2, -s.size / 2, s.size, s.size);
      }
      sctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function paint(now) {
      if (pending) {
        stampFrame(stroke, lctx);
        kctx.clearRect(0, 0, stroke.width, stroke.height);
        pending = false;
      }
      trackFace(now);
      drawSnaps();
      requestAnimationFrame(paint);
    }

    // Now and then a click gives a fruit label instead of your face: the little glossy PLU stickers on supermarket fruit.
    // Made-up generic wording and real produce codes, no brands
    const LABEL_COLOURS = [['#e2231a', '#fff'], ['#ffd21f', '#1a1a1a'], ['#1f9d3a', '#fff'], ['#1e4fd8', '#fff'], ['#ff7a00', '#fff'], ['#111', '#ffd21f']];
    const LABEL_TOP = ['ORGANIC', 'FRESH', 'PREMIUM', 'SWEET', 'CRISP', 'JUICY', 'RIPE'];
    const LABEL_BOTTOM = ['PRODUCT OF SPAIN', 'PRODUCT OF ITALY', 'GROWN IN KENYA', 'PRODUCT OF CHILE', 'PRODUCT OF PERU', 'GROWN IN FRANCE'];
    const PLU = ['4011', '4046', '4131', '4225', '3283', '4020', '94011', '4958', '3107', '4030', '4065', '94131'];
    const any = list => list[Math.floor(Math.random() * list.length)];

    function fruitLabel(size) {
      const img = document.createElement('canvas');
      img.width = img.height = size;
      const c = img.getContext('2d');
      const [bg, ink] = any(LABEL_COLOURS), round = Math.random() < 0.35;
      const rx = size * 0.44, ry = round ? rx : size * 0.3, cx = size / 2, cy = size / 2;
      const oval = (x, y, grow = 0) => { c.beginPath(); c.ellipse(x, y, rx + grow, ry + grow, 0, 0, Math.PI * 2); };

      // stuck-on shadow, white die-cut border, then the printed label
      c.save();
      c.shadowColor = 'rgba(0,0,0,.35)';
      c.shadowBlur = size * 0.04;
      c.shadowOffsetY = size * 0.015;
      oval(cx, cy);
      c.fillStyle = '#fff';
      c.fill();
      c.restore();
      oval(cx, cy, -size * 0.025);
      c.fillStyle = bg;
      c.fill();
      c.save();
      c.clip();
      // a thin inner rule, like a printed border
      oval(cx, cy, -size * 0.05);
      c.strokeStyle = ink;
      c.globalAlpha = 0.6;
      c.lineWidth = size * 0.008;
      c.stroke();
      c.globalAlpha = 1;

      c.fillStyle = ink;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      const font = (weight, px) => `${weight} ${px}px "Helvetica Neue", Arial, sans-serif`;
      c.font = font(800, size * 0.075);
      c.fillText(any(LABEL_TOP), cx, cy - ry * 0.52);
      const code = any(PLU);
      c.font = font(900, size * (code.length > 4 ? 0.17 : 0.2));
      c.fillText(code, cx, cy + ry * 0.02);
      c.font = font(700, size * 0.042);
      c.fillText(any(LABEL_BOTTOM), cx, cy + ry * 0.55);

      // gloss across the top
      const gloss = c.createLinearGradient(0, cy - ry, 0, cy);
      gloss.addColorStop(0, 'rgba(255,255,255,.45)');
      gloss.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = gloss;
      c.fillRect(0, cy - ry, size, ry);
      c.restore();
      return img;
    }

    // A face snapshot (or, with no face, what's under the cursor), cropped upright and given the grainy rim
    function faceSnap(size) {
      let cx = lastClick.x, cy = lastClick.y, side = SNAP_RADIUS * 2;
      if (face) ({ x: cx, y: cy, size: side } = face);
      const img = document.createElement('canvas');
      img.width = img.height = size;
      const c = img.getContext('2d');
      if (face) { // crop upright even if the head is tilted, so the snapshot lines up when it maps back on
        c.translate(size / 2, size / 2);
        c.rotate(-face.angle);
        c.translate(-size / 2, -size / 2);
      }
      c.drawImage(frame, (cx - side / 2) * dpr, (cy - side / 2) * dpr, side * dpr, side * dpr, 0, 0, size, size);
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.globalCompositeOperation = 'destination-in';
      c.drawImage(pick(SNAP_TIPS), 0, 0, size, size);
      return img;
    }

    function addSticker(img, x, y, label) {
      snaps.push({
        img, x, y, size: SNAP_RADIUS * 2, angle: 0, lag: 0.05 + Math.random() * 0.12,
        slot: snaps.length * GOLDEN_ANGLE,  // spread evenly around the face, however many there are
        reach: 0.4 + Math.random() * 0.15,  // distance from the face's centre, as a fraction of its size
        tilt: label ? (Math.random() - 0.5) * 0.8 : 0, // labels sit at a jaunty angle, like a sticker slapped on
      });
    }

    // Click: your face or a fruit label, starting at the cursor, with a shutter flash.
    // The odds of a label shift every click (rare to likely), and now and then extra labels scatter out too
    let lastClick = { x: 0, y: 0 };
    addEventListener('pointerdown', e => {
      if (e.button !== 0 || !live) return;
      lastClick = { x: e.clientX, y: e.clientY };
      grabFrame();
      const size = SNAP_RADIUS * 2 * dpr;
      const labelOdds = 0.1 + Math.random() * 0.55;
      const label = Math.random() < labelOdds;
      addSticker(label ? fruitLabel(size) : faceSnap(size), e.clientX, e.clientY, label);
      if (Math.random() < 0.15) { // a surprise burst of labels
        for (let i = 1 + Math.floor(Math.random() * 2); i > 0; i--) {
          addSticker(fruitLabel(size), e.clientX + (Math.random() - 0.5) * 80, e.clientY + (Math.random() - 0.5) * 80, true);
        }
      }

      flash.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
    });

    addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      lctx.clearRect(0, 0, layers.width, layers.height);
      snaps.length = 0;
    });

    function resize() {
      dpr = devicePixelRatio || 1;
      const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
      // keep what's been painted: copy it out, resize, and draw it back
      const kept = document.createElement('canvas');
      kept.width = layers.width; kept.height = layers.height;
      if (kept.width) kept.getContext('2d').drawImage(layers, 0, 0);
      layers.width = w; layers.height = h;
      if (kept.width) lctx.drawImage(kept, 0, 0);
      for (const c of [ground, frame, stroke, snapshots]) { c.width = w; c.height = h; }
      gctx.fillStyle = gctx.createPattern(PAINT, 'repeat');
      gctx.fillRect(0, 0, w, h);
    }

    addEventListener('resize', resize);
    resize();
    requestAnimationFrame(paint);
  </script>
</body>
</html>
