<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IKB</title>
  <style>
    :root { --ikb: #1f27a9; } /* International Klein Blue, warmed towards ultramarine like the real pigment */
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ikb); }

    /* Layers, bottom to top: grainy IKB ground, camera painted on with the brush, snapshots on top */
    canvas, #flash {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    body { touch-action: none; }
    video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; } /* frames are drawn from it, not shown */
    #flash {
      background: #fff;
      opacity: 0;
      transition: opacity .35s ease-out;
    }
    #flash.on { opacity: .35; transition: none; }
  </style>
</head>
<body>
  <video autoplay muted playsinline></video>
  <canvas id="ground"></canvas>
  <canvas id="layers"></canvas>
  <canvas id="snapshots"></canvas>
  <div id="flash"></div>
  <script>
    // Paint with the camera on a canvas of IKB: the brush stamps what the camera sees at that moment and it stays,
    // so strokes layer up over time. A click takes a small snapshot of your face (or now and then a fruit label), which glides onto your face
    // in the live camera, taking its own spot in a ring around it, and follows as you move. Esc clears.
    const RADIUS = 90;          // brush
    const SNAP_RADIUS = 60;     // click snapshot
    const SHRINK = 0.2;         // snapped faces are minis, at this fraction of your face's size
    const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5)); // ~137.5°, so each new sticker lands in the biggest gap
    const IKB = getComputedStyle(document.documentElement).getPropertyValue('--ikb').trim();

    const video = document.querySelector('video');
    let live = false;
    navigator.mediaDevices?.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
      .then(stream => {
        video.srcObject = stream;
        video.addEventListener('playing', () => live = true, { once: true });
      })
      .catch(err => console.warn('Camera unavailable, showing the monochrome:', err.name));

    // Face finding runs on-device with MediaPipe; loaded dynamically so the page still works if it can't load
    let faceDetector = null;
    (async () => {
      try {
        const { FaceDetector, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs');
        const wasm = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm');
        faceDetector = await FaceDetector.createFromOptions(wasm, {
          baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' },
          runningMode: 'VIDEO',
        });
      } catch (err) {
        console.warn('Face finding unavailable, snapshots will show what is under the cursor and stay put:', err);
      }
    })();

    const ground = document.getElementById('ground'), gctx = ground.getContext('2d');
    const layers = document.getElementById('layers'), lctx = layers.getContext('2d');
    const snapshots = document.getElementById('snapshots'), sctx = snapshots.getContext('2d');
    const flash = document.getElementById('flash');
    const frame = document.createElement('canvas'), fctx = frame.getContext('2d');   // the current camera frame
    const stroke = document.createElement('canvas'), kctx = stroke.getContext('2d'); // brush marks waiting to be painted
    let dpr = 1;

    // IKB with a powdery pigment grain built in
    const PAINT = (() => {
      const tile = document.createElement('canvas');
      tile.width = tile.height = 220;
      const t = tile.getContext('2d');
      t.fillStyle = IKB;
      t.fillRect(0, 0, 220, 220);
      const img = t.getImageData(0, 0, 220, 220);
      for (let i = 0; i < img.data.length; i += 4) {
        const shade = 1 - Math.random() ** 3 * 0.35; // mostly flat colour, with scattered darker specks
        img.data[i] *= shade; img.data[i + 1] *= shade; img.data[i + 2] *= shade;
      }
      t.putImageData(img, 0, 0);
      return tile;
    })();

    // Grainy tips: solid in the middle, breaking up into random speckle towards the rim like dry pigment.
    // A few variants, picked at random, so the grain never repeats
    function makeTips(radius, count, edge = 0.75) { // edge: how far in from the rim the grain reaches
      return Array.from({ length: count }, () => {
        const size = radius * 2, tip = document.createElement('canvas');
        tip.width = tip.height = size;
        const t = tip.getContext('2d'), img = t.createImageData(size, size);
        for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
          const d = Math.hypot(x - radius + 0.5, y - radius + 0.5) / radius;
          const keep = Math.min(1, Math.max(0, (1 - d) / edge)) ** 1.6; // 1 at the centre, 0 at the rim
          if (Math.random() < keep) img.data[(y * size + x) * 4 + 3] = 255;
        }
        t.putImageData(img, 0, 0);
        return tip;
      });
    }
    const TIPS = makeTips(RADIUS, 8);
    const SNAP_TIPS = makeTips(SNAP_RADIUS, 6, 0.35); // a narrower grain band, so small faces stay clear
    const pick = tips => tips[Math.floor(Math.random() * tips.length)];

    // Copy the camera's current frame, cropped to cover the window and mirrored like a selfie view
    function grabFrame() {
      const w = frame.width, h = frame.height;
      const scale = Math.max(w / video.videoWidth, h / video.videoHeight);
      const vw = video.videoWidth * scale, vh = video.videoHeight * scale;
      fctx.setTransform(-1, 0, 0, 1, w, 0);
      fctx.drawImage(video, (w - vw) / 2, (h - vh) / 2, vw, vh);
      fctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // Stamp the current frame through a mask of grainy tips onto a layer
    function stampFrame(mask, target) {
      grabFrame();
      fctx.globalCompositeOperation = 'destination-in';
      fctx.drawImage(mask, 0, 0);
      fctx.globalCompositeOperation = 'source-over';
      target.drawImage(frame, 0, 0);
    }

    // Brush: collect grainy dabs along the cursor's path, then paint them with the camera once per frame
    let last = null, pending = false;
    function dab(x, y) {
      kctx.drawImage(pick(TIPS), (x - RADIUS) * dpr, (y - RADIUS) * dpr, RADIUS * 2 * dpr, RADIUS * 2 * dpr);
      pending = true;
    }
    addEventListener('pointermove', e => {
      if (!live) return;
      const x = e.clientX, y = e.clientY;
      if (last) { // fill in between events so fast strokes stay continuous
        const n = Math.max(1, Math.ceil(Math.hypot(x - last.x, y - last.y) / (RADIUS * 0.3)));
        for (let i = 1; i <= n; i++) dab(last.x + (x - last.x) * i / n, last.y + (y - last.y) * i / n);
      } else dab(x, y);
      last = { x, y };
    });
    document.addEventListener('pointerleave', () => last = null);

    // Face tracking: where the biggest face is on screen right now (CSS pixels), its size, and its tilt
    let face = null, lastVideoTime = -1;
    function trackFace(now) {
      if (!faceDetector || !live || !video.videoWidth || video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;
      let d;
      try {
        d = faceDetector.detectForVideo(video, now).detections
          .sort((a, b) => b.boundingBox.width * b.boundingBox.height - a.boundingBox.width * a.boundingBox.height)[0];
      } catch (err) { // a bad frame shouldn't stop the page animating
        console.warn('Face tracking skipped a frame:', err);
        return;
      }
      if (!d) { face = null; return; }
      // video pixels → the mirrored, cover-cropped screen
      const W = innerWidth, H = innerHeight, vw = video.videoWidth, vh = video.videoHeight;
      const scale = Math.max(W / vw, H / vh), ox = (W - vw * scale) / 2, oy = (H - vh * scale) / 2;
      const toScreen = (x, y) => [W - (ox + x * scale), oy + y * scale];
      const b = d.boundingBox;
      const [x, y] = toScreen(b.originX + b.width / 2, b.originY + b.height / 2);
      const [rex, rey] = toScreen(d.keypoints[0].x * vw, d.keypoints[0].y * vh); // eyes, for the head's tilt
      const [lex, ley] = toScreen(d.keypoints[1].x * vw, d.keypoints[1].y * vh);
      face = { x, y, size: Math.max(b.width, b.height) * scale * 1.6, angle: Math.atan2(rey - ley, rex - lex) };
    }

    // Snapshots glide towards the tracked face, each with its own lag, so they trail as echoes when you move
    const snaps = [];
    function drawSnaps() {
      sctx.setTransform(1, 0, 0, 1, 0, 0);
      sctx.clearRect(0, 0, snapshots.width, snapshots.height);
      for (const s of snaps) {
        if (face) {
          // each sticker's spot in the ring turns with the head and scales with the face
          const a = s.slot + face.angle, r = s.reach * face.size;
          s.x += (face.x + Math.cos(a) * r - s.x) * s.lag;
          s.y += (face.y + Math.sin(a) * r - s.y) * s.lag;
          s.size += (face.size * SHRINK - s.size) * s.lag;
          let turn = face.angle - s.angle;
          turn = Math.atan2(Math.sin(turn), Math.cos(turn));
          s.angle += turn * s.lag;
        }
        sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        sctx.translate(s.x, s.y);
        sctx.rotate(s.angle + s.tilt);
        sctx.drawImage(s.img, -s.size / 2, -s.size / 2, s.size, s.size);
      }
      sctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function paint(now) {
      if (pending) {
        stampFrame(stroke, lctx);
        kctx.clearRect(0, 0, stroke.width, stroke.height);
        pending = false;
      }
      trackFace(now);
      drawSnaps();
      requestAnimationFrame(paint);
    }

    // Now and then a click gives a fruit label instead of your face, in the style of real produce stickers:
    // ovals, rounds, lemon tags and gold foil, with little illustrations, arched lettering and a mix of languages.
    // Every name and picture is invented, so no real brands
    const any = list => list[Math.floor(Math.random() * list.length)];
    const LABEL_NAMES = ['Golden Hour', 'Sunny Grove', 'Little Sun', 'Bella Fresca', 'Blue Orchard', 'Pip & Peel', 'Mango Tango',
      'Estrella', 'Paloma', 'Cielo', 'Honeymoon', 'Orchard Queen', 'Big Juicy', 'Palmera', 'Sol y Luna', 'Kiss Me Ripe'];
    const LABEL_LINES = ['CERTIFIED ORGANIC', 'QUALITY FRUIT', 'SWEET & JUICY', 'HAND PICKED', 'SUN RIPENED', 'CHILL & ENJOY', 'PREMIUM SELECTION'];
    const LABEL_PLACES = ['Ecuador', 'Spain', 'Italy', 'Chile', 'Peru', 'Kenya', 'Costa Rica', 'Philippines', 'New Zealand', 'Morocco'];
    const LABEL_WORDS = ['特選', '甘熟', '新鮮', 'あまい', 'طازج', 'Fresco', 'Dolce', 'Süß'];
    const PLU = ['4011', '4046', '4131', '4225', '3283', '4020', '94011', '4958', '3107', '4030', '4065', '94131'];
    const INKS = [ // [ground, print, accent]
      ['#1c3fa8', '#ffd21f', '#ffffff'], ['#e2231a', '#ffd21f', '#ffffff'], ['#1f8f3a', '#ffffff', '#ffd21f'],
      ['#111111', '#f2c230', '#ffffff'], ['#ffffff', '#e2231a', '#1c3fa8'], ['#ffffff', '#1f8f3a', '#e2231a'],
      ['#ff7a00', '#ffffff', '#1c3fa8'], ['#ffe600', '#e2231a', '#1f8f3a'],
    ];
    const DARK_INKS = ['#e2231a', '#1c3fa8', '#1f8f3a', '#111111', '#d4101a']; // strong enough to read on white labels
    const FONTS = {
      bold: px => `900 ${px}px "Arial Black", "Helvetica Neue", Arial, sans-serif`,
      slab: px => `700 ${px}px Rockwell, "American Typewriter", Georgia, serif`,
      script: px => `italic 700 ${px}px "Snell Roundhand", "Brush Script MT", "Segoe Script", cursive`,
      small: px => `700 ${px}px "Helvetica Neue", Arial, sans-serif`,
      jp: px => `800 ${px}px "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif`,
    };

    // Little illustrations, drawn centred on (x, y) at radius r
    const ICONS = {
      sun(c, x, y, r, col) {
        c.fillStyle = col;
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * Math.PI * 2;
          c.beginPath();
          c.moveTo(x + Math.cos(a - 0.13) * r * 0.55, y + Math.sin(a - 0.13) * r * 0.55);
          c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
          c.lineTo(x + Math.cos(a + 0.13) * r * 0.55, y + Math.sin(a + 0.13) * r * 0.55);
          c.fill();
        }
        c.beginPath(); c.arc(x, y, r * 0.5, 0, Math.PI * 2); c.fill();
      },
      star(c, x, y, r, col) {
        c.fillStyle = col;
        c.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = i / 10 * Math.PI * 2 - Math.PI / 2, d = i % 2 ? r * 0.42 : r;
          c.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
        }
        c.fill();
      },
      leaf(c, x, y, r, col) {
        c.fillStyle = col;
        c.beginPath();
        c.moveTo(x - r, y + r * 0.2);
        c.quadraticCurveTo(x - r * 0.1, y - r * 1.1, x + r, y - r * 0.2);
        c.quadraticCurveTo(x + r * 0.1, y + r * 1.1, x - r, y + r * 0.2);
        c.fill();
      },
      apple(c, x, y, r, col) {
        c.fillStyle = col;
        c.beginPath(); c.arc(x - r * 0.32, y + r * 0.1, r * 0.62, 0, Math.PI * 2); c.arc(x + r * 0.32, y + r * 0.1, r * 0.62, 0, Math.PI * 2); c.fill();
        c.fillRect(x - r * 0.05, y - r * 0.85, r * 0.1, r * 0.4);
        ICONS.leaf(c, x + r * 0.3, y - r * 0.72, r * 0.28, col);
      },
      cherries(c, x, y, r, col) {
        c.strokeStyle = c.fillStyle = col;
        c.lineWidth = r * 0.09;
        c.beginPath(); c.moveTo(x - r * 0.45, y + r * 0.3); c.quadraticCurveTo(x - r * 0.1, y - r * 0.5, x + r * 0.2, y - r * 0.85);
        c.moveTo(x + r * 0.45, y + r * 0.3); c.quadraticCurveTo(x + r * 0.35, y - r * 0.4, x + r * 0.2, y - r * 0.85); c.stroke();
        c.beginPath(); c.arc(x - r * 0.45, y + r * 0.45, r * 0.38, 0, Math.PI * 2); c.arc(x + r * 0.45, y + r * 0.45, r * 0.38, 0, Math.PI * 2); c.fill();
      },
      palm(c, x, y, r, col) {
        c.strokeStyle = c.fillStyle = col;
        c.lineWidth = r * 0.14;
        c.beginPath(); c.moveTo(x - r * 0.1, y + r); c.quadraticCurveTo(x + r * 0.15, y, x, y - r * 0.45); c.stroke();
        for (const a of [-2.6, -2.0, -1.2, -0.5, 0.1]) {
          c.save(); c.translate(x, y - r * 0.45); c.rotate(a); ICONS.leaf(c, r * 0.5, 0, r * 0.5, col); c.restore();
        }
      },
      diamond(c, x, y, r, col) {
        c.strokeStyle = col;
        c.lineWidth = r * 0.08;
        c.lineJoin = 'round';
        c.beginPath();
        c.moveTo(x - r, y - r * 0.3); c.lineTo(x - r * 0.5, y - r * 0.8); c.lineTo(x + r * 0.5, y - r * 0.8); c.lineTo(x + r, y - r * 0.3); c.lineTo(x, y + r * 0.9); c.closePath();
        c.moveTo(x - r, y - r * 0.3); c.lineTo(x + r, y - r * 0.3);
        c.moveTo(x - r * 0.5, y - r * 0.8); c.lineTo(x - r * 0.25, y - r * 0.3); c.lineTo(x, y + r * 0.9);
        c.moveTo(x + r * 0.5, y - r * 0.8); c.lineTo(x + r * 0.25, y - r * 0.3); c.lineTo(x, y + r * 0.9);
        c.stroke();
      },
      heart(c, x, y, r, col) {
        c.fillStyle = col;
        c.beginPath();
        c.moveTo(x, y + r * 0.85);
        c.bezierCurveTo(x - r * 1.2, y + r * 0.05, x - r * 0.7, y - r * 0.95, x, y - r * 0.4);
        c.bezierCurveTo(x + r * 0.7, y - r * 0.95, x + r * 1.2, y + r * 0.05, x, y + r * 0.85);
        c.fill();
      },
    };

    // Text set along a circle, reading left to right over the top (or under the bottom)
    function arcText(c, text, x, y, r, top = true) {
      const chars = [...text], widths = chars.map(ch => c.measureText(ch).width);
      const span = widths.reduce((a, b) => a + b, 0) / r;
      let a = (top ? -Math.PI / 2 : Math.PI / 2) + (top ? -span / 2 : span / 2);
      c.save();
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      chars.forEach((ch, i) => {
        const step = widths[i] / r / 2;
        a += top ? step : -step;
        c.save();
        c.translate(x + Math.cos(a) * r, y + Math.sin(a) * r);
        c.rotate(a + (top ? Math.PI / 2 : -Math.PI / 2));
        c.fillText(ch, 0, 0);
        c.restore();
        a += top ? step : -step;
      });
      c.restore();
    }

    // Shrink a font until the text fits the width
    function fitText(c, text, font, px, maxW) {
      do c.font = font(px); while (c.measureText(text).width > maxW && (px *= 0.92) > 4);
    }

    // Label outlines, centred on the canvas
    function outline(c, kind, s) {
      const cx = s / 2, cy = s / 2;
      c.beginPath();
      if (kind === 'circle') c.arc(cx, cy, s * 0.42, 0, Math.PI * 2);
      else if (kind === 'lemon') { // oval with a pointed tip on one side
        c.moveTo(cx - s * 0.44, cy);
        c.bezierCurveTo(cx - s * 0.44, cy - s * 0.4, cx + s * 0.3, cy - s * 0.36, cx + s * 0.46, cy);
        c.bezierCurveTo(cx + s * 0.3, cy + s * 0.36, cx - s * 0.44, cy + s * 0.4, cx - s * 0.44, cy);
      } else if (kind === 'foil') { // a soft triangle, point up
        const r = s * 0.08;
        c.moveTo(cx, cy - s * 0.4);
        c.arcTo(cx + s * 0.44, cy + s * 0.36, cx - s * 0.44, cy + s * 0.36, r);
        c.arcTo(cx - s * 0.44, cy + s * 0.36, cx, cy - s * 0.4, r);
        c.arcTo(cx, cy - s * 0.4, cx + s * 0.44, cy + s * 0.36, r);
        c.closePath();
      } else c.ellipse(cx, cy, s * 0.44, s * 0.32, 0, 0, Math.PI * 2); // oval
    }

    // A label's white die-cut backing with a small stuck-on shadow, then its printed ground
    function base(c, kind, s, fill) {
      c.save();
      c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = s * 0.04; c.shadowOffsetY = s * 0.015;
      c.translate(s / 2, s / 2); c.scale(1.05, 1.05); c.translate(-s / 2, -s / 2);
      outline(c, kind, s); c.fillStyle = '#fff'; c.fill();
      c.restore();
      outline(c, kind, s); c.fillStyle = fill; c.fill();
    }

    // The layouts, each loosely after a kind of label in the reference
    const LAYOUTS = {
      sunburst(c, s, [bg, ink]) { // bold name arched over a starburst, place underneath
        base(c, 'oval', s, bg);
        any([ICONS.sun, ICONS.star])(c, s / 2, s * 0.52, s * 0.14, ink);
        c.fillStyle = ink; c.font = FONTS.bold(s * 0.085);
        arcText(c, any(LABEL_NAMES).toUpperCase(), s / 2, s * 0.6, s * 0.3);
        c.font = FONTS.small(s * 0.06); c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(any(LABEL_PLACES), s / 2, s * 0.76);
      },
      script(c, s) { // white label, coloured rim, icon above a script name
        const kind = any(['oval', 'circle']), ink = any(DARK_INKS);
        base(c, kind, s, '#fff');
        c.lineWidth = s * 0.03; c.strokeStyle = any(DARK_INKS); c.stroke();
        any([ICONS.diamond, ICONS.apple, ICONS.cherries, ICONS.heart])(c, s / 2, s * 0.4, s * 0.1, ink);
        c.fillStyle = ink; c.textAlign = 'center'; c.textBaseline = 'middle';
        const name = any(LABEL_NAMES);
        fitText(c, name, FONTS.script, s * 0.13, s * 0.66);
        c.fillText(name, s / 2, s * 0.62);
      },
      banner(c, s, [bg, ink, accent]) { // leaves behind a big slanted name, small line on top
        base(c, 'oval', s, bg);
        c.save(); c.clip();
        c.globalAlpha = 0.35;
        for (let i = -2; i <= 2; i++) { c.save(); c.translate(s / 2 + i * s * 0.14, s * 0.62); c.rotate(-Math.PI / 2 + i * 0.35); ICONS.leaf(c, s * 0.12, 0, s * 0.14, accent); c.restore(); }
        c.restore();
        c.fillStyle = ink; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = FONTS.small(s * 0.055); c.fillText(any(LABEL_LINES), s / 2, s * 0.32);
        const name = any(LABEL_NAMES);
        c.save(); c.translate(s / 2, s * 0.53); c.transform(1, 0, -0.18, 1, 0, 0);
        fitText(c, name, FONTS.slab, s * 0.15, s * 0.7); c.fillText(name, 0, 0); c.restore();
      },
      tag(c, s, [bg, ink, accent]) { // lemon-shaped tag with a fruit, a name and the PLU number
        base(c, 'lemon', s, bg);
        ICONS.apple(c, s * 0.3, s * 0.47, s * 0.09, accent);
        c.fillStyle = ink; c.textAlign = 'left'; c.textBaseline = 'middle';
        const name = any(LABEL_NAMES);
        fitText(c, name, FONTS.slab, s * 0.075, s * 0.42); c.fillText(name, s * 0.42, s * 0.4);
        c.font = FONTS.bold(s * 0.12); c.fillText(any(PLU), s * 0.42, s * 0.55);
      },
      round(c, s, [bg, ink, accent]) { // text all round the edge, a heart in the middle, the PLU below it
        base(c, 'circle', s, bg);
        c.fillStyle = ink; c.font = FONTS.small(s * 0.07);
        arcText(c, any(LABEL_LINES), s / 2, s / 2, s * 0.33, true);
        arcText(c, any(LABEL_PLACES).toUpperCase(), s / 2, s / 2, s * 0.33, false);
        ICONS.heart(c, s / 2, s * 0.46, s * 0.13, accent);
        c.fillStyle = ink; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = FONTS.bold(s * 0.07); c.fillText('#' + any(PLU), s / 2, s * 0.63);
      },
      foil(c, s) { // gold foil, red lettering, in Japanese or another language
        const kind = any(['foil', 'circle']);
        const gold = c.createLinearGradient(0, s * 0.1, s, s * 0.9);
        ['#8a6a12', '#f7df7a', '#b8891c', '#fff1b0', '#9c7414'].forEach((col, i, a) => gold.addColorStop(i / (a.length - 1), col));
        base(c, kind, s, gold);
        ICONS.apple(c, s / 2, kind === 'foil' ? s * 0.44 : s * 0.36, s * 0.07, '#d4101a');
        c.fillStyle = '#d4101a'; c.textAlign = 'center'; c.textBaseline = 'middle';
        const word = any(LABEL_WORDS);
        fitText(c, word, FONTS.jp, s * 0.14, s * 0.4); c.fillText(word, s / 2, s * 0.6);
      },
      organic(c, s) { // white round, arched "ORGANICALLY GROWN", an illustration in the middle
        base(c, 'circle', s, '#fff');
        const col = any(DARK_INKS), ink = any(DARK_INKS);
        c.fillStyle = col; c.font = FONTS.bold(s * 0.075);
        arcText(c, 'ORGANICALLY', s / 2, s / 2, s * 0.32, true);
        arcText(c, 'GROWN', s / 2, s / 2, s * 0.32, false);
        any([ICONS.palm, ICONS.leaf, ICONS.sun, ICONS.cherries])(c, s / 2, s / 2, s * 0.15, ink);
      },
    };

    function fruitLabel(size) {
      const img = document.createElement('canvas');
      img.width = img.height = size;
      const c = img.getContext('2d');
      LAYOUTS[any(Object.keys(LAYOUTS))](c, size, any(INKS));
      // a touch of gloss across the top
      const gloss = c.createLinearGradient(0, size * 0.15, 0, size * 0.5);
      gloss.addColorStop(0, 'rgba(255,255,255,.35)');
      gloss.addColorStop(1, 'rgba(255,255,255,0)');
      c.globalCompositeOperation = 'source-atop';
      c.fillStyle = gloss;
      c.fillRect(0, 0, size, size * 0.5);
      return img;
    }

    // A face snapshot (or, with no face, what's under the cursor), cropped upright and given the grainy rim
    function faceSnap(size) {
      let cx = lastClick.x, cy = lastClick.y, side = SNAP_RADIUS * 2;
      if (face) ({ x: cx, y: cy, size: side } = face);
      const img = document.createElement('canvas');
      img.width = img.height = size;
      const c = img.getContext('2d');
      if (face) { // crop upright even if the head is tilted, so the snapshot lines up when it maps back on
        c.translate(size / 2, size / 2);
        c.rotate(-face.angle);
        c.translate(-size / 2, -size / 2);
      }
      c.drawImage(frame, (cx - side / 2) * dpr, (cy - side / 2) * dpr, side * dpr, side * dpr, 0, 0, size, size);
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.globalCompositeOperation = 'destination-in';
      c.drawImage(pick(SNAP_TIPS), 0, 0, size, size);
      return img;
    }

    function addSticker(img, x, y, label) {
      snaps.push({
        img, x, y, size: SNAP_RADIUS * 2, angle: 0, lag: 0.05 + Math.random() * 0.12,
        slot: snaps.length * GOLDEN_ANGLE,  // spread evenly around the face, however many there are
        reach: 0.4 + Math.random() * 0.15,  // distance from the face's centre, as a fraction of its size
        tilt: label ? (Math.random() - 0.5) * 0.8 : 0, // labels sit at a jaunty angle, like a sticker slapped on
      });
    }

    // Click: your face or a fruit label, starting at the cursor, with a shutter flash.
    // The odds of a label shift every click (rare to likely), and now and then extra labels scatter out too
    let lastClick = { x: 0, y: 0 };
    addEventListener('pointerdown', e => {
      if (e.button !== 0 || !live) return;
      lastClick = { x: e.clientX, y: e.clientY };
      grabFrame();
      const size = SNAP_RADIUS * 2 * dpr;
      const labelOdds = 0.1 + Math.random() * 0.55;
      const label = Math.random() < labelOdds;
      addSticker(label ? fruitLabel(size) : faceSnap(size), e.clientX, e.clientY, label);
      if (Math.random() < 0.15) { // a surprise burst of labels
        for (let i = 1 + Math.floor(Math.random() * 2); i > 0; i--) {
          addSticker(fruitLabel(size), e.clientX + (Math.random() - 0.5) * 80, e.clientY + (Math.random() - 0.5) * 80, true);
        }
      }

      flash.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
    });

    addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      lctx.clearRect(0, 0, layers.width, layers.height);
      snaps.length = 0;
    });

    function resize() {
      dpr = devicePixelRatio || 1;
      const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
      // keep what's been painted: copy it out, resize, and draw it back
      const kept = document.createElement('canvas');
      kept.width = layers.width; kept.height = layers.height;
      if (kept.width) kept.getContext('2d').drawImage(layers, 0, 0);
      layers.width = w; layers.height = h;
      if (kept.width) lctx.drawImage(kept, 0, 0);
      for (const c of [ground, frame, stroke, snapshots]) { c.width = w; c.height = h; }
      gctx.fillStyle = gctx.createPattern(PAINT, 'repeat');
      gctx.fillRect(0, 0, w, h);
    }

    addEventListener('resize', resize);
    resize();
    requestAnimationFrame(paint);
  </script>
</body>
</html>
